name: connector_demo
version: "1"
description: >
  Requires the example connector pack. Load it locally (no entry point):
  readyagents run examples/connector_demo.yaml --pack examples/packs/connector_pack.py
  readyagents packs --pack examples/packs/connector_pack.py

start: ping
nodes:
  - id: ping
    type: tool
    tool: connector_ping
    arguments:
      message: "hello"
    output_key: hit
    next: wrap

  - id: wrap
    type: transform
    template: "connector_demo ok: {{hit.message}}"
    output_key: summary
