name: support_triage
version: "1"
description: >
  Classify a customer message (priority + category) then draft a reply.
  Classification should be JSON only so the condition node can branch.
  Dry-run: readyagents run examples/support_triage.yaml --dry-run

inputs:
  message: >
    Hi, our production checkout has been returning 500s for 20 minutes.
    Customers cannot pay. Please escalate.

start: classify
nodes:
  - id: classify
    type: agent
    system: >
      You triage customer support. Reply with JSON only, no markdown, no extra text.
      Schema: {"priority": "low"|"medium"|"high"|"urgent", "category": "billing"|"bug"|"how-to"|"account"|"other", "reason": "one sentence"}
      Rules: production outages and data loss are urgent; payment failures are high; questions are low or medium.
    prompt: |
      Classify this customer message:

      {{message}}
    output_key: classification_raw
    timeout_seconds: 90
    next: parse

  - id: parse
    type: transform
    source: classification_raw
    parse_json: true
    output_key: classified
    next: branch

  - id: branch
    type: condition
    when: classified.priority == "urgent"
    then: urgent_reply
    else: normal_reply

  - id: urgent_reply
    type: agent
    system: >
      You are a calm senior support engineer. Acknowledge urgency, say we are
      investigating, ask for one diagnostic detail, do not promise a timeline you
      cannot keep. 4–8 sentences.
    prompt: |
      Customer message:
      {{message}}

      Internal classification:
      {{classified}}

      Draft the reply.
    output_key: reply
    timeout_seconds: 90

  - id: normal_reply
    type: agent
    system: >
      You are a friendly support specialist. Be clear and concise. 4–8 sentences.
    prompt: |
      Customer message:
      {{message}}

      Internal classification:
      {{classified}}

      Draft the reply.
    output_key: reply
    timeout_seconds: 90
